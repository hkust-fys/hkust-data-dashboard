[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkust-data-dashboard"
version = "2.0.0"
description = "Real-time HKUST campus dashboard for Discord: transit ETAs, weather, traffic, and gate cameras."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "discord.py>=2.3",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
hkust-dashboard = "bot:main"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: smoke tests that hit public endpoints and require internet access; no API keys",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
